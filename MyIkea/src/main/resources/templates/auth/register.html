<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<main>
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="mx-5 mt-3">
        <h1>Registro de Usuario</h1>
        
        <!-- Mostrar mensaje de error si las contraseñas no coinciden -->
        <div th:if="${param.passwordMismatch}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>❌ Error en el registro</strong>
            <p class="mb-0">Las contraseñas no coinciden. Por favor, inténtalo de nuevo.</p>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" th:field="*{password}" required minlength="8">
                <small class="form-text text-muted">Mínimo 8 caracteres</small>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Repetir Contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="8">
                <small id="passwordError" class="form-text text-danger" style="display: none;">
                    Las contraseñas no coinciden
                </small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Regístrate</button>
                <a href="/login" class="btn btn-primary">Iniciar Sesión</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/footer:: footer}"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js" integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
    const passwordField = document.getElementById('password');
    const confirmPasswordField = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');
    const registerForm = document.getElementById('registerForm');

    // Validar en tiempo real mientras el usuario escribe
    confirmPasswordField.addEventListener('input', validatePasswordMatch);
    passwordField.addEventListener('input', validatePasswordMatch);

    function validatePasswordMatch() {
        if (passwordField.value !== confirmPasswordField.value) {
            confirmPasswordField.classList.add('is-invalid');
            passwordError.style.display = 'block';
        } else {
            confirmPasswordField.classList.remove('is-invalid');
            passwordError.style.display = 'none';
        }
    }

    // Validar antes de enviar el formulario
    registerForm.addEventListener('submit', function(event) {
        if (passwordField.value !== confirmPasswordField.value) {
            event.preventDefault();
            validatePasswordMatch();
            return false;
        }
    });
</script>
</body>
</html>
