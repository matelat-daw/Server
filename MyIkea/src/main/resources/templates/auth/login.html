<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<header th:replace="~{fragments/header:: header}"></header>

<div class="container-sm" style="margin-top: 50px;">
    <!-- Mostrar mensaje de error si hay problema de autenticación -->
    <div th:if="${param.error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>❌ Error de Autenticación</strong>
        <p class="mb-0">Email o contraseña incorrectos. Por favor, intenta nuevamente.</p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Mostrar mensaje de logout si se cerró sesión correctamente -->
    <div th:if="${param.logout != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>✅ Sesión cerrada</strong>
        <p class="mb-0">Has cerrado sesión correctamente. ¡Hasta pronto!</p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Mostrar mensaje de contraseña no coinciden en registro -->
    <div th:if="${param.passwordMismatch != null}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong>⚠️ Contraseñas no coinciden</strong>
        <p class="mb-0">Las contraseñas ingresadas no son iguales. Por favor, intenta de nuevo.</p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="username" name="username" placeholder="Introduce tu correo" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Introduce tu contraseña" required>
        </div>
        <div class="d-flex justify-content-start gap-2">
            <button type="submit" class="btn btn-primary">Entrar</button>
            <a href="/register" class="btn btn-success">Regístrate</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/footer:: footer}"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js" integrity="sha512-TPh2Oxlg1zp+kz3nFA0C5vVC6leG/6mm1z9+mA81MI5eaUVqasPLO8Cuk4gMF4gUfP5etR73rgU/8PNMsSesoQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js" integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
