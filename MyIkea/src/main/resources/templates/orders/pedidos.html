<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head::head}"></head>
<body>
    <header th:replace="~{fragments/header::header}"></header>

    <div class="container mt-5 mb-6" style="margin-bottom: 8rem;">
        <h1>Lista de Pedidos</h1>
        <div th:if="${pedidos == null or pedidos.isEmpty()}">
            <div class="alert alert-warning" role="alert">
                No tienes pedidos completados.
            </div>
        </div>
        <table class="table table-striped mt-3" th:if="${pedidos != null and pedidos.size() > 0}">
            <thead>
            <tr>
                <th scope="col">Fecha del Pedido</th>
                <th scope="col">Total</th>
                <th scope="col">Productos</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${#temporals.format(pedido.orderDate, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${pedido.totalPrice}"></td>
                <td>
                    <ul>
                        <li th:each="producto : ${pedido.products}" th:text="${producto.productName}"></li>
                    </ul>
                </td>
                <td>
                    <a th:href="@{/orders/details/{id}(id=${pedido.orderId})}" class="btn btn-info">Detalles del Pedido</a>
                </td>
            </tr>
            </tbody>
        </table>

        <a href="/products" class="btn btn-primary mt-3">Seguir Comprando</a>
    </div>

    <footer th:replace="~{fragments/footer::footer}"></footer>
    <th:block th:replace="~{fragments/scripts::scripts}"></th:block>
</body>
</html>
