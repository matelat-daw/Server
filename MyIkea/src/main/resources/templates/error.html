<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - MyIkea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Plantilla de error simplificada: NO carga fragmentos complejos para evitar recursion -->
    <header class="bg-white border-bottom">
        <nav class="navbar navbar-light bg-white">
            <div class="container-fluid">
                <a href="/" class="navbar-brand fw-bold">MyIkea</a>
            </div>
        </nav>
    </header>
    
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h2 class="mb-0">Vaya! Algo salio mal</h2>
                    </div>
                    <div class="card-body">
                        <h4 class="card-title text-danger mb-4">Se ha producido un error</h4>
                        <p class="card-text lead" th:text="${error ?: 'Ha ocurrido un error inesperado.'}">Ha ocurrido un error inesperado.</p>
                        <hr>
                        <p>Si el problema persiste, contacta con soporte.</p>
                        <a href="/" class="btn btn-primary mt-3">
                            <i class="fas fa-home"></i> Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2024 MyIkea. Todos los derechos reservados.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
