<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head::head}"></head>
<body>
    <header th:replace="~{fragments/header::header}"></header>

    <div class="container mt-4 mb-6" style="margin-bottom: 8rem;">
        <h2>Carrito de Compras</h2>

        <!-- Mensaje de error si no hay productos -->
        <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

        <!-- Mostrar productos si existen -->
        <table class="table table-striped mt-3" th:if="${carrito != null and carrito.products != null and carrito.products.size() > 0}">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${carrito.products}" th:if="${producto != null}">
                <td th:text="${producto.productName}"></td>
                <td th:text="${producto.productPrice}"></td>
                <td>1</td>
                <td>
                    <a th:href="@{/cart/remove/{id}(id=${producto.productId})}" class="btn btn-danger">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${carrito == null or carrito.products == null or carrito.products.isEmpty()}">
            <p class="text-muted">Tu Carrito Está Vacío.</p>
        </div>

        <div th:if="${carrito != null and carrito.products != null and !carrito.products.isEmpty()}">
            <div class="d-flex justify-content-between mt-4">
                <h3>Total: </h3>
                <h3 th:text="${carrito.totalPrice}">0</h3>
            </div>
        </div>

        <div class="d-flex mt-3">
            <a href="/products" class="btn btn-primary">Seguir Comprando</a>
            <a href="/orders/complete" class="btn btn-success ms-3">Terminar Pedido</a>
        </div>
    </div>

    <footer th:replace="~{fragments/footer::footer}"></footer>
    <th:block th:replace="~{fragments/scripts::scripts}"></th:block>
</body>
</html>
