worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    server {
        listen 80;
        server_name localhost;
        index index.php index.html index.htm;
        error_log c:/server/logs/project-energy-error.log;
        access_log c:/server/logs/project-energy-access.log;
        root C:/Server/html;
        
        charset utf-8;

        # Rutas estáticas: no reescribir
        location ~* \.(js|css|jpg|jpeg|png|gif|ico|woff|woff2|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            log_not_found off;
        }

        # Seguridad: evitar acceso directo a archivos sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Database y otros directorios sensibles
        location ~ ^/Project-Energy/(database|config)/ {
            deny all;
        }

        # Frontend estático
        location /Project-Energy/frontend/ {
            try_files $uri $uri/ =404;
        }

        # API: reescribir todas las solicitudes a index.php
        location ^~ /Project-Energy/api/ {
            try_files $uri $uri/ /Project-Energy/api/index.php?$args;
            
            location ~ \.php$ {
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param SCRIPT_NAME $fastcgi_script_name;
                fastcgi_index index.php;
                fastcgi_pass 127.0.0.1:9000;
            }
        }

        # Frontend SPA: reescribir a index.htm para rutas dinámicas
        location /Project-Energy/ {
            try_files $uri $uri/ /Project-Energy/frontend/index.htm =404;
        }

        # PHP por defecto (para root)
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Raíz: reescribir a index.html
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Manifest y robots.txt
        location ~* (manifest\.json|robots\.txt|sitemap\.xml)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
