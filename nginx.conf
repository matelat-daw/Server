worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 256M;

    # Se eliminó el bloque "types" manual para evitar los warnings de duplicados

    # Habilitar compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    # Cabeceras de seguridad globales
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Servidor upstream para NexusAPI (Spring Boot)
    upstream nexus_api {
        server 127.0.0.1:8080;
    }

    server {
			listen       80;
			server_name  localhost;
			root         "D:/Server/html"; # Comillas para evitar problemas con rutas
			index        index.php index.html index.htm;

			error_log    "D:/Server/logs/localhost.error.log";
			access_log   "D:/Server/logs/localhost.access.log";

			autoindex on;

			# Configuración de caché para recursos estáticos
			location ~* ^/(?!phpmyadmin/).+\.(jpg|jpeg|gif|png|webp|ico|svg|css|js)$ {
				expires 1y;
				add_header Cache-Control "public, no-transform";
				try_files $uri =404;
			}

			# Evitar indexación de carpetas privadas
			location ~ ^/(Energy|Project-Energy)/(database|services|utils)/ {
				add_header X-Robots-Tag "noindex, nofollow" always;
				deny all;
			}

			# ENERGY
			location /Energy/api/ {
				try_files $uri $uri/ /Energy/api/index.php$is_args$args;
			}

			location /Energy/ {
				try_files $uri $uri/ /Energy/index.php$is_args$args;
			}

			# PROJECT-ENERGY
			location /Project-Energy/api/ {
				try_files $uri $uri/ /Project-Energy/api/index.php$is_args$args;
			}

			location /Project-Energy/ {
				try_files $uri $uri/ /Project-Energy/index.php$is_args$args;
			}

			# OTRAS APIS
			location /Nueva-BS/api/ {
				try_files $uri $uri/ /Nueva-BS/api/index.php$is_args$args;
			}

			location /Nueva-WEB/api/ {
				try_files $uri $uri/ /Nueva-WEB/api/index.php$is_args$args;
			}

			# PHPMYADMIN
			location = /phpmyadmin {
				return 301 /phpmyadmin/;
			}

			location /phpmyadmin/ {
				# ✓ Usar root en lugar de alias para que $document_root funcione correctamente
				root "D:/Server";
				index index.php;
				try_files $uri $uri/ =404;
				
				# Procesar PHP específicamente en phpmyadmin
				location ~ \.php$ {
					fastcgi_pass   127.0.0.1:9000;
					fastcgi_index  index.php;
					include        fastcgi_params;
					# ✓ Con root, SCRIPT_FILENAME se resuelve correctamente
					fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
					fastcgi_param  PATH_INFO $fastcgi_path_info;
				}
			}
			
			# PROCESAMIENTO PHP GLOBAL
			location ~ \.php$ {
				fastcgi_pass   127.0.0.1:9000;
				fastcgi_index  index.php;
				include        fastcgi_params;
				fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
			}

        # NEXUS API (Spring Boot Proxy)
        location /api/ {
            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}