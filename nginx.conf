worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    # Tipos MIME adicionales
    types {
        application/manifest+json json;
        application/xml xml;
        image/svg+xml svg;
    }

    # Habilitar compresión Gzip (Equivalente a mod_deflate)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    # Cabeceras de seguridad globales
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Servidor upstream para NexusAPI (Spring Boot)
    upstream nexus_api {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name localhost;
        root C:/Server/html;
        index index.php index.html index.htm;

        error_log C:/Server/logs/localhost.error.log;
        access_log C:/Server/logs/localhost.access.log;

        autoindex on;

        # Configuración de caché para recursos estáticos (Equivalente a mod_expires)
        # Se excluye phpmyadmin de esta regla global para que sus alias funcionen correctamente
        location ~* ^/(?!phpmyadmin/).+\.(jpg|jpeg|gif|png|webp|ico|svg|css|js)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Evitar indexación de carpetas privadas (Equivalente a FilesMatch en .htaccess)
        location ~ ^/(Energy|Project-Energy)/(database|services|utils)/ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            deny all;
        }

        # ============================================
        # ENERGY (Carpeta Energy)
        # ============================================
        
        # API de Energy
        location /Energy/api/ {
            try_files $uri $uri/ /Energy/api/index.php$is_args$args;
        }

        # App de Energy (Frontend y SPA routing)
        location /Energy/ {
            # Se usa el index.php de la raíz de Energy como punto de entrada
            try_files $uri $uri/ /Energy/index.php$is_args$args;
        }

        # ============================================
        # PROJECT-ENERGY (Carpeta Project-Energy)
        # ============================================
        
        # API de Project-Energy
        location /Project-Energy/api/ {
            try_files $uri $uri/ /Project-Energy/api/index.php$is_args$args;
        }

        # App de Project-Energy (Frontend y SPA routing)
        location /Project-Energy/ {
            try_files $uri $uri/ /Project-Energy/index.php$is_args$args;
        }

        # ============================================
        # OTRAS APIS (Nueva-BS, Nueva-WEB)
        # ============================================
        location /Nueva-BS/api/ {
            try_files $uri $uri/ /Nueva-BS/api/index.php$is_args$args;
        }

        location /Nueva-WEB/api/ {
            try_files $uri $uri/ /Nueva-WEB/api/index.php$is_args$args;
        }

        # ============================================
        # PROCESAMIENTO PHP GLOBAL
        # ============================================
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ============================================
        # PHPMYADMIN (Fuera del root público)
        # ============================================
        location = /phpmyadmin {
            return 301 /phpmyadmin/;
        }

        location /phpmyadmin/ {
            alias C:/Server/phpMyAdmin/;
            index index.php;
            try_files $uri $uri/ =404;

            location ~ ^/phpmyadmin/(.+\.php)$ {
                alias C:/Server/phpMyAdmin/$1;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME C:/Server/phpMyAdmin/$1;
            }
        }

        # ============================================
        # NEXUS API (Spring Boot Proxy)
        # ============================================
        location /api/ {
            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
