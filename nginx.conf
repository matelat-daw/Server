worker_processes 1;

events {
worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile        on;
	keepalive_timeout  65;
	client_max_body_size 256M;

	# Servidor upstream para NexusAPI (Spring Boot)
	upstream nexus_api {
		server 127.0.0.1:8080;
	}

	# Servidor HTTP (puerto 80)
	server {
		listen 80;
		server_name localhost;
		index index.php index.html;
		error_log c:/server/logs/localhost.error.log;
		access_log c:/server/logs/localhost.access.log;
		root C:/Server/html;
		autoindex on;

		# ============================================
		# ENERGY (carpeta Energy)
		# ============================================
		location ^~ /Energy/api/ {
			try_files $uri $uri/ /Energy/api/index.php;
		}

		location ^~ /Energy/frontend/ {
			alias C:/Server/html/Energy/frontend/;
			try_files $uri =404;
		}

		location ^~ /Energy/ {
			alias C:/Server/html/Energy/frontend/;
			# Para history routing: si no es archivo estático, servir index.htm
			try_files $uri $uri/ /index.htm;
		}

		# ============================================
		# PROJECT-ENERGY (carpeta Project-Energy)
		# ============================================
		location ^~ /Project-Energy/api/ {
			try_files $uri $uri/ /Project-Energy/api/index.php;
		}

		location ^~ /Project-Energy/frontend/ {
			alias C:/Server/html/Project-Energy/frontend/;
			try_files $uri =404;
		}

		location ^~ /Project-Energy/ {
			alias C:/Server/html/Project-Energy/frontend/;
			# Para history routing: si no es archivo estático, servir index.htm
			try_files $uri $uri/ /index.htm;
		}

		# Configuración PHP para Nueva-BS API
		location ^~ /Nueva-BS/api/ {
			try_files $uri $uri/ /Nueva-BS/api/index.php?$query_string;
		}

		# Configuración PHP para Nueva-WEB API
		location ^~ /Nueva-WEB/api/ {
			try_files $uri $uri/ /Nueva-WEB/api/index.php?$query_string;
		}

		location ~ \.php$ {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param SCRIPT_NAME $fastcgi_script_name;
			fastcgi_index index.php;
			fastcgi_pass 127.0.0.1:9000;
		}

		# Redirección de /phpmyadmin a /phpmyadmin/
		location = /phpmyadmin {
			return 301 /phpmyadmin/;
		}

		# Configuración para phpMyAdmin fuera de la carpeta pública
		location /phpmyadmin/ {
			alias C:/Server/phpMyAdmin/;
			index index.php;
			try_files $uri $uri/ =404;

			location ~ ^/phpmyadmin/(.+\.php)$ {
				alias C:/Server/phpMyAdmin/$1;
				fastcgi_pass 127.0.0.1:9000;
				fastcgi_index index.php;
				fastcgi_param SCRIPT_FILENAME C:/Server/phpMyAdmin/$1;
				include fastcgi_params;
			}
		}

		# Configuración para NexusAPI (Spring Boot) - API REST
		location /api/ {
			proxy_pass http://nexus_api;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache_bypass $http_upgrade;
			proxy_read_timeout 60s;
		}

		# Configuración para NexusAPI (Spring Boot) - Frontend Angular (opcional)
		# Descomenta esta sección si tienes Angular corriendo en puerto 4200
		# location /nexus/ {
		#	proxy_pass http://127.0.0.1:4200/;
		#	proxy_http_version 1.1;
		#	proxy_set_header Upgrade $http_upgrade;
		#	proxy_set_header Connection 'upgrade';
		#	proxy_set_header Host $host;
		#	proxy_set_header X-Real-IP $remote_addr;
		#	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		#	proxy_set_header X-Forwarded-Proto $scheme;
		#	proxy_cache_bypass $http_upgrade;
		# }
	}
}